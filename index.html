<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LEZARD AI – il apprend à grimper</title>
<style>
  body { font-family: sans-serif; margin: 0; background: #1e1e2e; color: #eee; }
  #bar { padding: 8px 12px; background: #2a2a3e; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { padding: 6px 12px; cursor: pointer; }
  #status { margin-left: auto; font-size: 14px; }
  #stats { padding: 6px 12px; background: #242438; font-family: monospace; font-size: 13px; }
  canvas { display: block; background: #cfe8ff; width: 100%; height: calc(100vh - 85px); }
</style>
</head>
<body>
<div id="bar">
  <button id="btnPause">Pause</button>
  <button id="btnResume">Reprendre</button>
  <button id="btnReset">Réinitialiser</button>
  <button id="btnSave">Sauvegarder</button>
  <button id="btnLoad">Charger</button>
  <label>Vitesse <input type="range" id="speed" min="1" max="40" value="1"></label>
  <span id="status">Chargement de la physique…</span>
</div>
<div id="stats">En attente…</div>
<canvas id="cv"></canvas>

<script src="https://cdn.jsdelivr.net/npm/planck@1.0.0/dist/planck.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script src="physics.js"></script>
<script>
const statusEl = document.getElementById("status");

document.getElementById("btnPause").onclick = () => { ui.paused = true; };
document.getElementById("btnResume").onclick = () => { ui.paused = false; };
document.getElementById("btnReset").onclick = () => { ui.reset = true; };
document.getElementById("speed").oninput = (e) => { ui.speed = Number(e.target.value); };
document.getElementById("btnSave").onclick = () => { window.requestSave = true; };
document.getElementById("btnLoad").onclick = () => { window.requestLoad = true; };

async function startPython() {
  try {
    statusEl.textContent = "Chargement de Python et numpy…";
    const pyodide = await loadPyodide();
    const code = await (await fetch("walker.py?v=" + Date.now())).text();
    await pyodide.loadPackagesFromImports(code);
    statusEl.textContent = "Apprentissage en cours";
    await pyodide.runPythonAsync(code);
  } catch (err) {
    statusEl.textContent = "ERREUR : " + err;
    console.error(err);
  }
}

try {
  if (typeof planck === "undefined") throw new Error("planck.js n'a pas été chargé");
  initPhysics();
  statusEl.textContent = "Physique prête";
  requestAnimationFrame(renderLoop);
  startPython();
} catch (err) {
  statusEl.textContent = "ERREUR : " + err;
  console.error(err);
}
</script>
</body>
</html>
